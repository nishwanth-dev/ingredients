<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>embed test (mimics the Shopify theme)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* what the Dawn-based theme does to every page */
  html { font-size: 62.5%; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  body { margin: 0; font-size: 1.5rem; line-height: calc(1 + .8 / 1); font-family: 'Poppins', sans-serif; color: #121212; letter-spacing: .06rem; }
  a { color: inherit; } h2,h3 { font-family: 'Poppins'; } button { font: inherit; }
  .fake-header { position: sticky; top: 0; z-index: 100; height: 70px; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; padding: 0 30px; }
  #cart-icon-bubble { margin-left: auto; } #fake-drawer { position: fixed; right: 0; top: 0; width: 260px; height: 100%; background: #fff; box-shadow: -4px 0 20px rgba(0,0,0,.2); z-index: 100001; padding: 20px; display: none; }
  #fake-drawer.open { display: block; }
</style>
<link rel="stylesheet" href="ingredient-app.css"></head>
<body><div class="fake-header">fake sticky header <a id="cart-icon-bubble">cart <span id="count">0</span></a></div>
<cart-drawer><div id="fake-drawer"><b>cart drawer</b><div id="drawer-lines"></div></div></cart-drawer>
<div id="ingredient-app" data-cart="ajax" data-sticky-offset="56"></div>
<div style="height:300px;background:#eee">fake footer</div>
<script>
  /* a stand-in for the theme's <cart-drawer>, with the same four methods */
  window.__log = []; let n = 0;
  customElements.define('cart-drawer', class extends HTMLElement {
    getSectionsToRender() { return [{ id: 'cart-drawer' }, { id: 'cart-icon-bubble' }]; }
    renderContents(state) { window.__log.push('renderContents:' + Object.keys(state.sections || {}).join(',')); document.getElementById('drawer-lines').textContent = 'items: ' + state.items.length; this.querySelector('#fake-drawer').classList.add('open'); }
    open() {} close() { this.querySelector('#fake-drawer').classList.remove('open'); }
  });
  /* a stand-in for the store: product data and the add-to-cart call */
  const products = {
    'kids-sunscreen-spf-50-50g-pack-of-3': { title: 'Kids Sunscreen SPF 50 (pack of 3)', handle: 'kids-sunscreen-spf-50-50g-pack-of-3', featured_image: '//cdn.shopify.com/s/files/1/0619/9990/7032/files/19_d4aa3a6e-6c51-4ffe-a420-baa7725a1a49.webp?v=1790589416', variants: [{ id: 111, title: 'Default Title', price: 120000, available: true }] },
    '2-in-1-sunscreen-for-kids-spf-50': { title: '2-in-1 Sunscreen for Kids SPF 50 (50g)', handle: '2-in-1-sunscreen-for-kids-spf-50', featured_image: '//cdn.shopify.com/s/files/1/0619/9990/7032/files/genius.webp?v=1775554300', variants: [{ id: 221, title: '50 g', price: 50000, available: false }, { id: 222, title: '100 g', price: 89900, available: true }] },
  };
  const realFetch = window.fetch;
  window.fetch = (url, opts) => {
    const u = String(url);
    const m = u.match(/^\/products\/([^/]+)\.js/);
    if (m) return Promise.resolve(products[m[1]] ? new Response(JSON.stringify(products[m[1]]), { status: 200 }) : new Response('{}', { status: 404 }));
    if (u === '/cart/add.js') {
      const body = JSON.parse(opts.body); window.__log.push('add:' + JSON.stringify(body));
      if (window.__failNext) { window.__failNext = false; return Promise.resolve(new Response(JSON.stringify({ status: 422, description: 'sold out' }), { status: 422 })); }
      n++; document.getElementById('count').textContent = n;
      return Promise.resolve(new Response(JSON.stringify({ id: body.items[0].id, items: [{}], sections: { 'cart-drawer': '<div>x</div>', 'cart-icon-bubble': '<div>x</div>' } }), { status: 200 }));
    }
    return realFetch(url, opts);
  };
</script>
<script src="ingredient-app.js" defer></script></body></html>
